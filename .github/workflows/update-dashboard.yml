name: Update Service Dashboard

on:
  # 每天 UTC 1:00 = 北京时间 9:00 触发
  schedule:
    - cron: '0 1 * * *'
  # 允许手动触发测试
  workflow_dispatch:
    inputs:
      task_id:
        description: '推送任务 ID(留空使用默认)'
        required: false
        default: ''

permissions:
  contents: write

# 防止并发跑
concurrency:
  group: dashboard-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install pandas openpyxl requests

      - name: 确定任务 ID
        id: taskid
        run: |
          if [ -n "${{ inputs.task_id }}" ]; then
            echo "value=${{ inputs.task_id }}" >> $GITHUB_OUTPUT
          else
            echo "value=${{ secrets.PUSH_TASK_ID }}" >> $GITHUB_OUTPUT
          fi

      - name: 下载最新底表
        env:
          AIDOUTANG_COOKIE: ${{ secrets.AIDOUTANG_COOKIE }}
          PUSH_TASK_ID: ${{ steps.taskid.outputs.value }}
        run: |
          python scripts/download.py "今日底表.xlsx"

      - name: 处理数据 → 生成 JSON
        run: |
          python scripts/preprocess.py "今日底表.xlsx" "kanban_data.json"

      - name: 检查变更
        id: diff
        run: |
          if git diff --quiet kanban_data.json 2>/dev/null; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "[diff] kanban_data.json 无变化,跳过提交"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "[diff] kanban_data.json 有更新"
            git diff --stat kanban_data.json
          fi

      - name: 提交并推送
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kanban_data.json
          git commit -m "Auto-update dashboard data ($(date -u +'%Y-%m-%d %H:%M UTC))"
          git push

      - name: 清理临时文件
        if: always()
        run: rm -f "今日底表.xlsx"

      - name: 通知(成功)
        if: steps.diff.outputs.changed == 'true'
        run: |
          echo "✅ 看板数据已更新"
          echo "查看效果: https://mjx0217.github.io/service-kanban/"

      - name: 通知(无变化)
        if: steps.diff.outputs.changed == 'false'
        run: echo "ℹ️ 数据无变化,跳过部署"
