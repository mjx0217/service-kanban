<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>服务沟通看板</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
  background: #f0f2f5;
  color: #333;
  min-height: 100vh;
}

/* Header */
.header {
  background: linear-gradient(135deg, #1a73e8, #0d47a1);
  color: white;
  padding: 20px 32px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  box-shadow: 0 2px 8px rgba(0,0,0,0.15);
}
.header h1 { font-size: 22px; font-weight: 600; }
.header-right { font-size: 13px; text-align: right; }

/* Filter Bar */
.filter-bar {
  background: white;
  padding: 14px 32px;
  display: flex;
  gap: 14px;
  align-items: center;
  flex-wrap: wrap;
  border-bottom: 1px solid #e8e8e8;
  position: sticky;
  top: 0;
  z-index: 100;
}
.filter-group {
  display: flex;
  align-items: center;
  gap: 8px;
}
.filter-group label { font-size: 13px; color: #666; font-weight: 500; white-space: nowrap; }
.filter-group select {
  padding: 6px 12px;
  border: 1px solid #d9d9d9;
  border-radius: 6px;
  font-size: 13px;
  outline: none;
  min-width: 110px;
  cursor: pointer;
  background: #fff;
}
.filter-group select:focus { border-color: #1a73e8; }
.filter-stats {
  margin-left: auto;
  font-size: 13px;
  color: #888;
  white-space: nowrap;
}
.search-box {
  display: flex;
  align-items: center;
  gap: 6px;
}
.search-box input {
  padding: 6px 12px;
  border: 1px solid #d9d9d9;
  border-radius: 6px;
  font-size: 13px;
  outline: none;
  width: 150px;
}
.search-box input:focus { border-color: #1a73e8; }

/* Subject Sections */
.section { padding: 16px 32px; }
.section + .section { padding-top: 0; }

.subject-header {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 12px;
}
.subject-title {
  font-size: 16px;
  font-weight: 600;
  color: #1a73e8;
  background: #e8f0fe;
  padding: 6px 16px;
  border-radius: 20px;
  display: inline-block;
}
.subject-meta {
  font-size: 12px;
  color: #888;
}

/* Group Cards Container */
.group-card-wrap {
  background: white;
  border-radius: 12px;
  padding: 16px 20px;
  margin-bottom: 14px;
  box-shadow: 0 1px 4px rgba(0,0,0,0.07);
  border: 1px solid #f0f0f0;
}

/* Group Header */
.group-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 14px;
  padding-bottom: 10px;
  border-bottom: 2px solid #f0f0f0;
}
.group-name {
  font-size: 14px;
  font-weight: 600;
  color: #333;
  display: flex;
  align-items: center;
  gap: 8px;
}
.group-name::before {
  content: '';
  display: inline-block;
  width: 4px;
  height: 16px;
  background: #1a73e8;
  border-radius: 2px;
}
.group-actions {
  display: flex;
  gap: 6px;
  align-items: center;
}
.group-actions .teacher-tag {
  font-size: 12px;
  background: #f0fdf4;
  color: #16a34a;
  padding: 3px 10px;
  border-radius: 12px;
  border: 1px solid #bbf7d0;
}

/* Metrics Grid */
.metrics-grid {
  display: grid;
  grid-template-columns: repeat(9, 1fr);
  gap: 8px;
}
.metric-box {
  background: #f8f9fa;
  border-radius: 8px;
  padding: 10px 10px 8px;
  text-align: center;
  transition: background 0.15s;
}
.metric-box:hover { background: #e8f0fe; }
.metric-name {
  font-size: 11px;
  color: #888;
  margin-bottom: 3px;
  white-space: nowrap;
}
.metric-val {
  font-size: 17px;
  font-weight: 700;
  color: #1a73e8;
}
.metric-val.green { color: #16a34a; }
.metric-val.orange { color: #d97706; }
.metric-val.gray { color: #666; }

/* Rate row */
.rate-row {
  display: flex;
  gap: 8px;
  margin-top: 10px;
  padding-top: 10px;
  border-top: 1px solid #f0f0f0;
}
.rate-item {
  flex: 1;
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 12px;
  padding: 4px 8px;
  background: #f8f9fa;
  border-radius: 6px;
}
.rate-label { color: #888; }
.rate-val { font-weight: 600; color: #333; }

/* Empty state */
.empty-state {
  text-align: center;
  padding: 60px 20px;
  color: #999;
  font-size: 15px;
}

/* Footer */
.footer {
  text-align: center;
  padding: 24px;
  color: #aaa;
  font-size: 12px;
}
.scroll-top {
  position: fixed;
  bottom: 24px;
  right: 24px;
  width: 42px;
  height: 42px;
  background: #1a73e8;
  color: white;
  border: none;
  border-radius: 50%;
  cursor: pointer;
  font-size: 18px;
  box-shadow: 0 2px 10px rgba(26,115,232,0.4);
  display: none;
}
.scroll-top.visible { display: block; }

/* Divider */
.section-divider {
  height: 1px;
  background: #e8e8e8;
  margin: 8px 32px;
}
</style>
</head>
<body>

<div class="header">
  <h1>📊 服务沟通看板</h1>
  <div class="header-right">
    <div>数据日期：<span id="dataDate">-</span></div>
    <div style="margin-top:2px">共 <span id="totalCards">0</span> 个教学组</div>
  </div>
</div>

<div class="filter-bar">
  <div class="filter-group">
    <label>基地</label>
    <select id="filterBase"><option value="">全部</option></select>
  </div>
  <div class="filter-group">
    <label>学科</label>
    <select id="filterSubject"><option value="">全部</option></select>
  </div>
  <div class="filter-group">
    <label>教学组</label>
    <select id="filterGroup"><option value="">全部</option></select>
  </div>
  <div class="filter-group">
    <label>课包类型</label>
    <select id="filterPkg"><option value="">全部</option><option value="常规课包">常规课包</option><option value="抖音课包">抖音课包</option></select>
  </div>
  <div class="search-box">
    <input type="text" id="searchInput" placeholder="搜索教学组...">
  </div>
  <div class="filter-stats">
    当前显示 <span id="visibleCount">0</span> / <span id="totalCount">0</span> 个教学组
  </div>
</div>

<div id="content"></div>
<div class="footer">服务沟通看板 · 每日数据更新</div>

<button class="scroll-top" id="scrollTopBtn" onclick="window.scrollTo({top:0,behavior:'smooth'})">↑</button>

<script>
let allData = [];

fetch('kanban_data.json')
  .then(r => r.json())
  .then(data => {
    allData = data;
    initFilters(data);
    render(data);
  })
  .catch(() => {
    document.getElementById('content').innerHTML = '<div class="empty-state">数据加载失败，请刷新重试</div>';
  });

function initFilters(data) {
  const bases = [...new Set(data.map(d => d.base || ''))].sort();
  const subjects = [...new Set(data.map(d => d.subject || ''))].sort();
  const groups = [...new Set(data.map(d => d.group || ''))].sort();

  fillSelect('filterBase', bases);
  fillSelect('filterSubject', subjects);
  fillSelect('filterGroup', groups);

  document.getElementById('totalCards').textContent = new Set(data.map(d => d.subject + '||' + d.group)).size;
  document.getElementById('totalCount').textContent = document.getElementById('totalCards').textContent;
  document.getElementById('dataDate').textContent = new Date().toLocaleDateString('zh-CN');
}

function fillSelect(id, values) {
  const sel = document.getElementById(id);
  values.forEach(v => {
    const opt = document.createElement('option');
    opt.value = v;
    opt.textContent = v;
    sel.appendChild(opt);
  });
}

function getFilters() {
  return {
    base: document.getElementById('filterBase').value,
    subject: document.getElementById('filterSubject').value,
    group: document.getElementById('filterGroup').value,
    pkg: document.getElementById('filterPkg').value,
    search: document.getElementById('searchInput').value.trim().toLowerCase()
  };
}

function filterData(data) {
  const f = getFilters();
  return data.filter(d => {
    if (f.base && d.base !== f.base) return false;
    if (f.subject && d.subject !== f.subject) return false;
    if (f.group && d.group !== f.group) return false;
    if (f.search && !(d.group.toLowerCase().includes(f.search) || d.subject.toLowerCase().includes(f.search))) return false;
    return true;
  });
}

function groupBy(data, key) {
  const g = {};
  data.forEach(d => {
    const k = key(d);
    if (!g[k]) g[k] = [];
    g[k].push(d);
  });
  return g;
}

function pct(a, b) {
  if (!b) return '0%';
  return Math.round(a / b * 100) + '%';
}

function fmt(n) {
  if (n >= 10000) return (n / 10000).toFixed(1) + 'w';
  return n.toLocaleString();
}

function aggTeacher(d) {
  return {
    teacher: d.teacher,
    inClassCount: d.inClassCount,
    bindCount: d.bindCount,
    joinGroupCount: d.joinGroupCount,
    coverCount: d.coverCount,
    interactCount: d.interactCount,
    activeCount: d.activeCount,
    phoneCount: d.phoneCount,
    confirmCount: d.confirmCount,
    attendCount: d.attendCount,
  };
}

function renderCard(d) {
  const bindRate = pct(d.bindCount, d.inClassCount);
  const joinRate = pct(d.joinGroupCount, d.inClassCount);
  const coverRate = pct(d.coverCount, d.inClassCount);
  const confirmRate = pct(d.confirmCount, d.inClassCount);
  const attendRate = pct(d.attendCount, d.inClassCount);

  return `
  <div class="metric-box">
    <div class="metric-name">${d.label}</div>
    <div class="metric-val${d.color}">${fmt(d.value)}</div>
  </div>`;
}

function render(data) {
  const filtered = filterData(data);
  const groupCount = new Set(filtered.map(d => d.subject + '||' + d.group)).size;
  document.getElementById('visibleCount').textContent = groupCount;
  document.getElementById('totalCount').textContent = new Set(allData.map(d => d.subject + '||' + d.group)).size;

  if (filtered.length === 0) {
    document.getElementById('content').innerHTML = '<div class="empty-state">没有找到匹配的数据</div>';
    return;
  }

  // Group by subject -> group
  const bySubject = groupBy(filtered, d => d.subject);
  let html = '';
  const subjectKeys = Object.keys(bySubject).sort();

  subjectKeys.forEach((subject, si) => {
    if (si > 0) html += '<div class="section-divider"></div>';
    const subjectData = bySubject[subject];
    const byGroup = groupBy(subjectData, d => d.group);
    const groupKeys = Object.keys(byGroup).sort();

    let groupHtml = '';
    groupKeys.forEach(group => {
      const groupRows = byGroup[group];
      const teachers = groupRows.map(d => d.teacher).sort();

      // Aggregate all teachers in this group
      const total = {
        inClassCount: groupRows.reduce((s, d) => s + d.inClassCount, 0),
        bindCount: groupRows.reduce((s, d) => s + d.bindCount, 0),
        joinGroupCount: groupRows.reduce((s, d) => s + d.joinGroupCount, 0),
        coverCount: groupRows.reduce((s, d) => s + d.coverCount, 0),
        interactCount: groupRows.reduce((s, d) => s + d.interactCount, 0),
        activeCount: groupRows.reduce((s, d) => s + d.activeCount, 0),
        phoneCount: groupRows.reduce((s, d) => s + d.phoneCount, 0),
        confirmCount: groupRows.reduce((s, d) => s + d.confirmCount, 0),
        attendCount: groupRows.reduce((s, d) => s + d.attendCount, 0),
      };

      const bindRate = pct(total.bindCount, total.inClassCount);
      const joinRate = pct(total.joinGroupCount, total.inClassCount);
      const coverRate = pct(total.coverCount, total.inClassCount);
      const confirmRate = pct(total.confirmCount, total.inClassCount);
      const attendRate = pct(total.attendCount, total.inClassCount);

      const teacherTags = teachers.map(t => `<span class="teacher-tag">${t}</span>`).join('');

      groupHtml += `
      <div class="group-card-wrap">
        <div class="group-header">
          <div class="group-name">${group}</div>
          <div class="group-actions">
            ${teacherTags}
          </div>
        </div>
        <div class="metrics-grid">
          <div class="metric-box">
            <div class="metric-name">在班人次</div>
            <div class="metric-val">${fmt(total.inClassCount)}</div>
          </div>
          <div class="metric-box">
            <div class="metric-name">绑定人次</div>
            <div class="metric-val green">${fmt(total.bindCount)}</div>
          </div>
          <div class="metric-box">
            <div class="metric-name">进群人次</div>
            <div class="metric-val">${fmt(total.joinGroupCount)}</div>
          </div>
          <div class="metric-box">
            <div class="metric-name">覆盖人次</div>
            <div class="metric-val">${fmt(total.coverCount)}</div>
          </div>
          <div class="metric-box">
            <div class="metric-name">交互人次</div>
            <div class="metric-val orange">${fmt(total.interactCount)}</div>
          </div>
          <div class="metric-box">
            <div class="metric-name">活跃人次</div>
            <div class="metric-val">${fmt(total.activeCount)}</div>
          </div>
          <div class="metric-box">
            <div class="metric-name">电话沟通</div>
            <div class="metric-val gray">${fmt(total.phoneCount)}</div>
          </div>
          <div class="metric-box">
            <div class="metric-name">出勤确认</div>
            <div class="metric-val green">${fmt(total.confirmCount)}</div>
          </div>
          <div class="metric-box">
            <div class="metric-name">预出勤人次</div>
            <div class="metric-val">${fmt(total.attendCount)}</div>
          </div>
        </div>
        <div class="rate-row">
          <div class="rate-item"><span class="rate-label">绑定率</span><span class="rate-val">${bindRate}</span></div>
          <div class="rate-item"><span class="rate-label">进群率</span><span class="rate-val">${joinRate}</span></div>
          <div class="rate-item"><span class="rate-label">覆盖率</span><span class="rate-val">${coverRate}</span></div>
          <div class="rate-item"><span class="rate-label">出勤确认率</span><span class="rate-val">${confirmRate}</span></div>
          <div class="rate-item"><span class="rate-label">预出勤率</span><span class="rate-val">${attendRate}</span></div>
        </div>
      </div>`;
    });

    html += `
    <div class="section">
      <div class="subject-header">
        <span class="subject-title">📚 ${subject}</span>
        <span class="subject-meta">${groupKeys.length} 个教学组 · ${subjectData.length} 位老师</span>
      </div>
      ${groupHtml}
    </div>`;
  });

  document.getElementById('content').innerHTML = html;
}

['filterBase','filterSubject','filterGroup','filterPkg'].forEach(id => {
  document.getElementById(id).addEventListener('change', () => render(allData));
});
document.getElementById('searchInput').addEventListener('input', () => render(allData));

window.addEventListener('scroll', () => {
  document.getElementById('scrollTopBtn').classList.toggle('visible', window.scrollY > 300);
});
</script>
</body>
</html>
